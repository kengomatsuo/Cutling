<!doctype html>
<html><head><meta charset="utf-8">
<!-- "It asks": the Cutling keyboard asking for the one part of a saved reply that changes, here an order
     number, beside the chat the reply is going into. The panel is rebuilt from the recorded 2.0 captures
     (~/Downloads/cutling-fill-ins/iphone/fillin_04_panel_plan.png); it is a drawing of the screen, not a
     capture, and the words on it are English. The ground is the store screenshots' teal.
     One file draws the card (wide window) and the details page (tall window). -->
<style>
  :root { --font: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; --mint: #06BF86; --ink: #0b0b0c; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1A9A84; font-family: var(--font); -webkit-font-smoothing: antialiased; color: var(--ink); }
  .piece { position: absolute; left: 0; top: 0; width: 402px; transform-origin: 0 0; }
  /* the chat */
  .in { display: inline-block; background: #E9E9EB; border-radius: 20px; padding: 9px 15px; font-size: 17px; line-height: 1.28; max-width: 290px; box-shadow: 0 10px 28px rgb(0 50 40 / 22%); }
  .field { margin-top: 14px; background: #fff; border-radius: 24px; padding: 11px 50px 12px 17px; font-size: 17px; line-height: 1.5; position: relative; box-shadow: 0 14px 40px rgb(0 50 40 / 28%); }
  .field .send { position: absolute; right: 8px; bottom: 8px; width: 31px; height: 31px; border-radius: 50%; background: #0A7AFF; display: grid; place-items: center; }
  .pill { display: inline-block; background: #D3F4E8; color: #067A59; border-radius: 7px; padding: 0 6px; line-height: 1.32; font-weight: 500; }
  .caret { display: inline-block; width: 2px; height: 20px; background: #0A7AFF; vertical-align: -4px; margin-left: 1px; border-radius: 1px; }
  /* the keyboard panel */
  .kb { background: #DCDEE5; border-radius: 36px; padding: 16px 14px 14px; box-shadow: 0 30px 70px rgb(0 45 36 / 38%), 0 2px 0 rgb(255 255 255 / 55%) inset; }
  .top { display: flex; align-items: center; gap: 10px; color: #7b7b82; font-size: 15px; }
  .x { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .top .n { margin-left: auto; padding-right: 4px; }
  .q { font-size: 25px; font-weight: 700; margin: 12px 0 0 2px; letter-spacing: -.01em; }
  .hint { display: flex; align-items: center; gap: 8px; color: #86868c; font-size: 13.5px; margin: 7px 0 0 2px; }
  .chips { display: flex; align-items: center; gap: 7px; margin-top: 30px; }
  .chip { background: #fff; border-radius: 22px; height: 40px; padding: 0 15px; display: flex; align-items: center; gap: 7px; font-size: 16px; position: relative; box-shadow: 0 1px 0 rgb(0 0 0 / 10%); }
  .chip.on { background: #C9F1E3; color: #05674B; font-weight: 600; transform: scale(.96); }
  .touch { position: absolute; width: 50px; height: 50px; border-radius: 50%; right: -26px; bottom: -32px; background: rgb(255 255 255 / 55%); box-shadow: 0 0 0 1.5px rgb(255 255 255 / 85%), 0 6px 18px rgb(0 40 30 / 25%); }
  .next { margin-left: auto; background: var(--mint); color: #fff; font-weight: 600; }
  .keys { display: flex; gap: 6px; margin-top: 12px; }
  .key { height: 44px; border-radius: 9px; background: #fff; display: grid; place-items: center; box-shadow: 0 1px 0 rgb(0 0 0 / 14%); }
  .key.w { width: 48px; } .key.s { flex: 1; } .key.r { width: 84px; background: var(--mint); }
  svg { display: block; }
</style></head><body>
<div class="piece" id="chat" style="z-index:2">
  <div class="in">Hi, is order 4821 on its way?</div>
  <div class="field">Hi! Order <span class="pill">4821</span> ships <span class="pill">Tue 24 Nov</span>.<br>Thank you for waiting.<span class="caret"></span>
    <span class="send"><svg width="15" height="17" viewBox="0 0 15 17"><path d="M7.5 15.5v-13M2 7.5l5.5-5.5L13 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
</div>
<div class="piece" id="panel"><div class="kb">
  <div class="top"><span class="x"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="#6b6b70" stroke-width="1.7" stroke-linecap="round"/></svg></span>Order update<span class="n">1 of 2</span></div>
  <div class="q">Order number</div>
  <div class="hint"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#86868c" stroke-width="1.1"><circle cx="8" cy="8" r="6.6"/><ellipse cx="8" cy="8" rx="2.9" ry="6.6"/><path d="M1.6 8h12.8M2.6 4.6h10.8M2.6 11.4h10.8"/></svg>Type it with your keyboard</div>
  <div class="chips">
    <span class="chip"><svg width="15" height="18" viewBox="0 0 15 18"><rect x="1" y="4" width="9.5" height="13" rx="2" fill="none" stroke="#0b0b0c" stroke-width="1.5"/><path d="M5 1.2h7.2A1.8 1.8 0 0 1 14 3v9.4h-2.2V4.3A1.3 1.3 0 0 0 10.5 3H5z" fill="#0b0b0c"/></svg>Paste</span>
    <span class="chip on">4821<i class="touch"></i></span>
    <span class="chip">4817</span>
    <span class="chip next">Next <svg width="8" height="13" viewBox="0 0 8 13"><path d="M1.5 1.5l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
  <div class="keys">
    <span class="key w"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="#0b0b0c" stroke-width="1"><circle cx="8" cy="8" r="6.6"/><ellipse cx="8" cy="8" rx="2.9" ry="6.6"/><path d="M1.6 8h12.8M2.6 4.6h10.8M2.6 11.4h10.8"/></svg></span>
    <span class="key w"><svg width="24" height="18" viewBox="0 0 24 18" fill="none" stroke="#0b0b0c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M8 1.5h12.5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8L1.5 9z"/><path d="M11.5 6l6 6M17.5 6l-6 6"/></svg></span>
    <span class="key s"></span>
    <span class="key r"><svg width="22" height="18" viewBox="0 0 22 18"><path d="M2.5 9.5l6 6L19.5 2.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
</div></div>
<script>
const W = innerWidth, H = innerHeight, TALL = H > W, U = Math.min(W, H) / 1080;
const chat = document.getElementById("chat"), panel = document.getElementById("panel");
const place = (el, x, y, k, deg) => { el.style.transform = `translate(${x}px, ${y}px) rotate(${deg}deg) scale(${k})`; };
// Apple's text starts at 69.5% of the card and 64.3% of the details page, so both pieces end near 60%.
if (TALL) { const k = 2.26 * U; place(chat, (W - 402 * k) / 2 - 14 * U, H * .098, k, -1.2); place(panel, (W - 402 * k) / 2 + 14 * U, H * .098 + chat.offsetHeight * k + 56 * U, k, 1.2); }
else { const k = 2.42 * U, kc = 2.1 * U; place(chat, W * .03, H * .3 - chat.offsetHeight * kc / 2 + 20 * U, kc, -1.2); place(panel, W * .478, H * .028, k, 1.2); }
const b = (el) => { const r = el.getBoundingClientRect(); return `${(r.top / H * 100).toFixed(1)}-${(r.bottom / H * 100).toFixed(1)}%`; };
document.fonts.ready.then(() => { window.__note = `it-asks ${W}x${H} chat ${b(chat)} panel ${b(panel)}`; window.__done = true; });
</script></body></html>

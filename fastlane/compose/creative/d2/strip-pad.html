<!doctype html><meta charset="utf-8">
<!-- Direction 2 on iPad, "Don't type it. Tap it. Done.": the same poster as strip.html across three 2064 x 2752
     frames (6192 x 2752), the real iPad screen in frame 3. -->
<style>
:root{--mint:#2FE6A7;--deep:#12C289;--side:#0A9469;--ink:#06140F;--sf:-apple-system,"SF Pro Display",system-ui,sans-serif}
html,body{margin:0;overflow:hidden}
html{height:2752px}
body{width:6192px;height:2752px;position:relative;background:var(--mint);font-family:var(--sf);color:var(--ink)}
h1{position:absolute;margin:0;top:140px;font:900 420px/.84 system-ui;font-variation-settings:"wdth" 50;letter-spacing:-4px;white-space:nowrap}
.sub{position:absolute;top:543px;font:700 124px/1 var(--sf);letter-spacing:-2px;white-space:nowrap}
.k{position:absolute;width:200px;height:246px;border-radius:32px;background:#fff;box-shadow:0 11px 0 var(--side),0 28px 34px rgba(0,80,54,.28);
   font:400 136px/236px var(--sf);text-align:center;color:#000}
.k img{height:94px;margin-top:76px}
.key{position:absolute;background:#fff;border-radius:calc(var(--w)*.0694);width:var(--w);height:calc(var(--w)*.3035);
   box-shadow:0 calc(var(--w)*.0153) 0 var(--side),0 calc(var(--w)*.04) calc(var(--w)*.053) rgba(0,70,48,.36)}
.key img{position:absolute;left:calc(var(--w)*.05);top:calc(var(--w)*.054);width:calc(var(--w)*.082);height:calc(var(--w)*.07);object-fit:contain}
.key b{position:absolute;left:calc(var(--w)*.152);top:calc(var(--w)*.052);font:650 calc(var(--w)*.073)/1 var(--sf);letter-spacing:-.02em;white-space:nowrap}
.key i{position:absolute;left:calc(var(--w)*.052);top:calc(var(--w)*.1706);font:400 calc(var(--w)*.0612)/1 var(--sf);font-style:normal;letter-spacing:-.01em;color:#8A8A8E;white-space:nowrap}
#tap{position:absolute;left:3560px;top:850px;width:330px;height:330px;border-radius:50%;background:rgba(6,20,15,.14);box-shadow:0 0 0 17px rgba(6,20,15,.92),0 0 0 84px rgba(6,20,15,.09)}
#pad{position:absolute;left:4338px;top:800px;width:1700px;box-sizing:border-box;padding:41px;border-radius:88px;background:#0b0b0c;
   box-shadow:0 0 0 5px #2a2d2c,0 0 0 9px #8f9694,0 60px 120px rgba(0,60,40,.45)}
#pad img{display:block;width:100%;border-radius:52px}
</style>
<h1 style="left:112px">Don’t type it.</h1>
<div class="sub" style="left:120px">41 keys. Every time.</div>
<div id="keys"></div>
<h1 style="left:2176px">Tap it.</h1>
<div class="sub" style="left:2184px">Cutling makes it one.</div>
<div class="key" style="--w:1640px;left:2580px;top:2640px;transform:rotate(3deg)"><img src="../assets/sym/c/video.png"><b>Meeting Link</b><i>https://meet.example…</i></div>
<div class="key" style="--w:1640px;left:2480px;top:2140px;transform:rotate(-2.5deg)"><img src="../assets/sym/c/wifi.png"><b>Wi-Fi Password</b><i>c0ff33-Sh0p-2024!</i></div>
<div class="key" style="--w:1640px;left:2560px;top:1640px;transform:rotate(2deg)"><img src="../assets/sym/c/envelope.png"><b>Email Signature</b><i>Best regards,…</i></div>
<div class="key" style="--w:2300px;left:2040px;top:800px;transform:rotate(-4deg)"><img src="../assets/sym/c/house.png"><b>Home Address</b><i>123 Main Street, Apt 4B…</i></div>
<div id="tap"></div>
<h1 style="left:4240px">Done.</h1>
<div class="sub" style="left:4248px">Pasted. No typos.</div>
<div id="pad"><img src="../assets/screens/pad/chat.png"></div>
<script>
// the address, key by key, as it is typed: 40 characters and the return between its two lines, 41 keys,
// each a hair off square like keys set by hand
const rows = ["123 Main", "Street, ", "Apt 4B\n", "New York, ", "NY 10001"];
let n = 0, seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const box = document.getElementById("keys");
rows.forEach((r, j) => [...r].forEach((ch, i) => {
  const d = document.createElement("div"); d.className = "k";
  if(ch === "\n") d.innerHTML = '<img src="../assets/sym/c/return-black.png">'; else d.textContent = ch === " " ? "" : ch;
  d.style.left = (120 + i * 222 + (rnd() - .5) * 14) + "px"; d.style.top = (900 + j * 290 + (rnd() - .5) * 16) + "px";
  d.style.transform = `rotate(${(rnd() - .5) * 9}deg)`; box.appendChild(d); n++;
}));
if(n !== 41) document.title = window.__error = "ERR " + n + " keys, the line says 41";
</script>
<script src="../ready.js"></script>

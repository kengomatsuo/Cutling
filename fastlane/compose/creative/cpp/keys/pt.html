<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<!-- The studio-render skill's path tracer, with two additions for the Cutling key still life: a texture
     (atlas-<scene>.png beside this file: what the keys and the phone's screen show) and a material that emits.
     A small path tracer. Every object is a signed
     distance field, every light is a soft box or the sky, and the picture is whatever the light does: no
     gradient, border or scrim is painted on. The window's shape picks the framing.
     Run from this folder with the scene file beside pt.html (about six minutes each at 1920x1080 on an M3):
       bun render.mjs "pt.html?scene=paperweight&spp=900" paperweight/card.png 1920 1080
       bun render.mjs "pt.html?scene=paperweight&spp=900" paperweight/details.png 1080 1920
     The scene is scene-<name>.glsl.js beside this file. -->
<canvas id="c"></canvas>
<!-- cpp/keys (ASG250): two additions to d1/pt.html. A panorama camera: ?fw=&fh=&ox= render the window as the slice
     [ox, ox+width) of a picture fw x fh, with the camera shifted along x per column (perspective in y only), so frames
     traced one at a time meet at their seams. And ?pass=u|v: one sample per pixel, no lens, writing which printed
     face or screen the first hit lands on (red) and where on it (green, blue: a 16-bit coordinate), raw. -->
<script>
const Q = new URLSearchParams(location.search);
const SCENE = Q.get("scene") || "paperweight", PASS = {u: 1, v: 2}[Q.get("pass")] || 0, SPP = PASS ? 1 : +(Q.get("spp") || 64);
document.write(`<script src="scenes/${SCENE}.glsl.js"><\/script>`);
</script>
<script>
const COMMON = `#version 300 es
precision highp float;
precision highp int;
uniform vec2 R; uniform vec2 FULL; uniform vec2 OFF; uniform int PASS; uniform int frame; uniform sampler2D prev; uniform sampler2D atlas; uniform float TALL;
out vec4 o;
const float PI = 3.14159265;
uint st;
float rnd(){ st = st*747796405u + 2891336453u; uint w = ((st >> ((st >> 28u) + 4u)) ^ st) * 277803737u; return float((w >> 22u) ^ w) / 4294967296.; }
vec2 rnd2(){ float a = rnd(); return vec2(a, rnd()); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float sdEll(vec3 p, vec3 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / k1; }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h * h * k * .25; }
float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x), mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y); }
vec3 cosDir(vec3 n){ vec2 u = rnd2(); float a = 2. * PI * u.x, r = sqrt(u.y);
  vec3 t = normalize(cross(n, abs(n.y) < .9 ? vec3(0, 1, 0) : vec3(1, 0, 0))), b = cross(n, t);
  return normalize(t * cos(a) * r + b * sin(a) * r + n * sqrt(1. - u.y)); }
vec3 sphDir(){ vec2 u = rnd2(); float z = 1. - 2. * u.x, r = sqrt(max(0., 1. - z * z)), a = 2. * PI * u.y; return vec3(r * cos(a), r * sin(a), z); }
struct Mat { vec3 alb; float rough; float f0; float trans; vec3 emit; };
struct Cam { vec3 pos; vec3 at; float fov; float lens; float focus; };
`;
const TRACE = `
vec3 nrm(vec3 p){ int id; vec2 e = vec2(NEPS, 0);
  return normalize(vec3(map(p + e.xyy, id) - map(p - e.xyy, id), map(p + e.yxy, id) - map(p - e.yxy, id), map(p + e.yyx, id) - map(p - e.yyx, id))); }
bool march(vec3 ro, vec3 rd, float tmax, out float t, out int id){
  t = 0.;
  for(int i = 0; i < 220; i++){
    float d = map(ro + rd * t, id);
    if(d < .0012 * (1. + t * .03)) return true;
    t += d * STEP;
    if(t > tmax) break;
  }
  return false; }
void basis(vec3 c, vec3 at, out vec3 n, out vec3 u, out vec3 v){ n = normalize(at - c); u = normalize(cross(n, vec3(0, 1, .0001))); v = cross(u, n); }
// A soft box glows on one side, dimmer toward its edge so its reflection has no hard rim.
bool lights(vec3 ro, vec3 rd, inout float tb, inout vec3 e){
  bool h = false;
  for(int i = 0; i < NL; i++){
    vec3 c, at, Le, n, u, v; vec2 hs; lightDef(i, c, at, hs, Le); basis(c, at, n, u, v);
    float dn = dot(rd, n); if(dn > -1e-4) continue;
    float t = dot(c - ro, n) / dn; if(t < 0. || t > tb) continue;
    vec3 q = ro + rd * t - c; vec2 s = vec2(dot(q, u), dot(q, v)) / hs;
    if(abs(s.x) > 1. || abs(s.y) > 1.) continue;
    vec2 f = smoothstep(1., .55, abs(s)); tb = t; e = Le * f.x * f.y; h = true;
  }
  return h; }
vec3 direct(vec3 p, vec3 n){
  int i = min(int(rnd() * float(NL)), NL - 1);
  vec3 c, at, Le, ln, u, v; vec2 hs; lightDef(i, c, at, hs, Le); basis(c, at, ln, u, v);
  vec2 s = rnd2() * 2. - 1.;
  vec3 w = c + u * s.x * hs.x + v * s.y * hs.y - p; float d2 = dot(w, w), d = sqrt(d2); w /= d;
  float cs = dot(n, w), cl = -dot(w, ln);
  if(cs <= 0. || cl <= 0.) return vec3(0);
  float t; int id; if(march(p + n * .012, w, d - .1, t, id)) return vec3(0);
  vec2 f = smoothstep(1., .55, abs(s));
  return Le * f.x * f.y * cs * cl * (4. * hs.x * hs.y) / d2 / PI * float(NL); }
vec3 trace(vec3 ro, vec3 rd){
  vec3 L = vec3(0), T = vec3(1); bool spec = true;
  for(int b = 0; b < 5; b++){
    float t; int id; bool hit = march(ro, rd, FAR, t, id);
    float tl = hit ? t : 1e9; vec3 e = vec3(0);
    if(lights(ro, rd, tl, e)){ if(spec) L += T * e; break; }
    if(!hit){ L += T * sky(rd); break; }
    vec3 p = ro + rd * t, n = nrm(p);
    if(dot(n, rd) > 0.) n = -n;
    Mat m = mat(id, p, n);
    L += T * m.emit;                                   // a screen gives off its own light
    float c = max(dot(n, -rd), 0.);
    float F = m.f0 + (1. - m.f0) * pow(1. - c, 5.);
    if(m.rough <= .6 && rnd() < F){
      vec3 r = normalize(reflect(rd, n) + m.rough * m.rough * sphDir() * 1.4);
      if(dot(r, n) < 0.) r = reflect(r, n);
      rd = r; spec = true;
    } else {
      T *= m.alb;
      if(rnd() < m.trans){ p -= n * THICK; n = -n; }   // light that comes out of the far side of a thin sheet
      L += T * direct(p, n);
      rd = cosDir(n); spec = false;
    }
    ro = p + n * .004;
    if(b > 1){ float q = clamp(max(T.r, max(T.g, T.b)), .05, 1.); if(rnd() > q) break; T /= q; }
  }
  return min(L, vec3(30.)); }
void main(){
  ivec2 px = ivec2(gl_FragCoord.xy);
  st = uint(px.x + int(OFF.x)) * 1973u + uint(px.y) * 9277u + uint(frame) * 26699u + 1u; rnd(); rnd();
  gT = rnd();
  Cam cam = camera();
  vec2 j = PASS > 0 ? vec2(0) : rnd2() + rnd2() - 1.;
  vec2 uv = (gl_FragCoord.xy + OFF + .5 * j - .5 * FULL) / FULL.y;
  vec3 f = normalize(cam.at - cam.pos), r = normalize(cross(f, vec3(0, 1, 0))), u = cross(r, f);
  float k = 2. * tan(radians(cam.fov) * .5);
  vec3 o0 = cam.pos + r * uv.x * k * length(cam.at - cam.pos);   // the camera slides along x: one view per column
  vec3 rd = normalize(f + uv.y * u * k);
  if(PASS > 0){
    float t; int id; vec3 q = vec3(0);
    if(march(o0, rd, FAR, t, id)) q = faceUV(id, o0 + rd * t);
    float s = PASS == 1 ? q.y : q.z; float w = floor(clamp(s, 0., 1.) * 65535. + .5);
    o = texelFetch(prev, px, 0) + vec4(q.x / 255., floor(w / 256.) / 255., mod(w, 256.) / 255., 1);
    return; }
  vec3 fp = o0 + rd * cam.focus / dot(rd, f);
  float a = 2. * PI * rnd(), rr = sqrt(rnd()) * cam.lens;
  vec3 ro = o0 + (r * cos(a) + u * sin(a)) * rr;
  rd = normalize(fp - ro);
  vec3 col = trace(ro, rd);
  o = texelFetch(prev, px, 0) + vec4(col, 1.);
}`;
const SHOW = `#version 300 es
precision highp float;
uniform sampler2D acc; uniform float EXPO; uniform float GRAIN; uniform int RAW; out vec4 o;
float h(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
// Khronos PBR Neutral: keeps a saturated brand red red instead of bending it to orange.
vec3 neutral(vec3 c){
  const float startCompression = .8 - .04, desaturation = .15;
  float x = min(c.r, min(c.g, c.b)); float offset = x < .08 ? x - 6.25 * x * x : .04; c -= offset;
  float peak = max(c.r, max(c.g, c.b)); if(peak < startCompression) return c;
  float d = 1. - startCompression; float newPeak = 1. - d * d / (peak + d - startCompression); c *= newPeak / peak;
  float g = 1. - 1. / (desaturation * (peak - newPeak) + 1.); return mix(c, newPeak * vec3(1), g); }
void main(){
  vec4 a = texelFetch(acc, ivec2(gl_FragCoord.xy), 0);
  if(RAW == 1){ o = vec4(a.rgb / max(a.a, 1.), 1); return; }
  vec3 c = neutral(a.rgb / max(a.a, 1.) * EXPO);
  c = mix(c * 12.92, 1.055 * pow(max(c, 0.), vec3(1. / 2.4)) - .055, step(.0031308, c));
  float n = h(gl_FragCoord.xy) + h(gl_FragCoord.xy + 17.) - 1.;
  o = vec4(c + n * GRAIN, 1);
}`;
const VS = `#version 300 es
void main(){ gl_Position = vec4(vec2(gl_VertexID == 1 ? 3 : -1, gl_VertexID == 2 ? 3 : -1), 0, 1); }`;

try {
  const W = innerWidth, H = innerHeight, cv = document.getElementById("c");
  cv.width = W; cv.height = H;
  const gl = cv.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
  if (!gl || !gl.getExtension("EXT_color_buffer_float")) throw new Error("no float WebGL2");
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = (fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
  const P = prog(COMMON + window.SCENE_GLSL + TRACE), PS = prog(SHOW);
  const tex = () => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f }; };
  let A = tex(), B = tex();
  gl.viewport(0, 0, W, H);
  let frame = 0;
  // Tiles keep each GPU job short, so the machine stays usable while a frame renders.
  const TILE = +(Q.get("tile") || 384), tiles = [];
  for (let y = 0; y < H; y += TILE) for (let x = 0; x < W; x += TILE) tiles.push([x, y, Math.min(TILE, W - x), Math.min(TILE, H - y)]);
  const px = new Uint8Array(4);
  function step() {
    gl.useProgram(P);
    gl.bindFramebuffer(gl.FRAMEBUFFER, B.f);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, A.t);
    gl.uniform1i(gl.getUniformLocation(P, "prev"), 0);
    gl.uniform2f(gl.getUniformLocation(P, "R"), W, H);
    gl.uniform2f(gl.getUniformLocation(P, "FULL"), +(Q.get("fw") || W), +(Q.get("fh") || H));
    gl.uniform2f(gl.getUniformLocation(P, "OFF"), +(Q.get("ox") || 0), 0);
    gl.uniform1i(gl.getUniformLocation(P, "PASS"), PASS);
    gl.uniform1i(gl.getUniformLocation(P, "frame"), frame);
    gl.uniform1f(gl.getUniformLocation(P, "TALL"), H > W ? 1 : 0);
    gl.enable(gl.SCISSOR_TEST);
    for (const [x, y, w, h] of tiles) { gl.scissor(x, y, w, h); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.flush(); }
    gl.disable(gl.SCISSOR_TEST);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, new Float32Array(4));
    [A, B] = [B, A];
    frame++;
    window.__progress = `spp ${frame}/${SPP}`;
    if (frame < SPP) setTimeout(step, 0); else show();
  }
  function show() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(PS);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, A.t);
    gl.uniform1i(gl.getUniformLocation(PS, "acc"), 0);
    gl.uniform1f(gl.getUniformLocation(PS, "EXPO"), +(Q.get("expo") || window.SCENE_EXPO || 1));
    gl.uniform1f(gl.getUniformLocation(PS, "GRAIN"), +(Q.get("grain") || .012));
    gl.uniform1i(gl.getUniformLocation(PS, "RAW"), PASS ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    window.__note = `${SCENE} ${W}x${H} ${SPP}spp`;
    window.__done = true;
  }
  // the atlas: sRGB in, linear out, so printed colours and the screen are lit as paint and light are
  const img = new Image(); img.src = Q.get("atlas") || "atlas.png";
  img.onload = () => {
    const at = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, at);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.useProgram(P); gl.uniform1i(gl.getUniformLocation(P, "atlas"), 1);
    step();
  };
  img.onerror = () => { window.__error = "ERR atlas missing"; };
} catch (e) { window.__error = "ERR " + e.message; document.title = window.__error; }
</script>
</body></html>

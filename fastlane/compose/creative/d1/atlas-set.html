<!doctype html><meta charset="utf-8">
<!-- The texture one still-life frame prints: ?spec=<json> lists the screens, the key faces (laid out as the
     app's grid tile: icon, name, first line) and the small glyph faces, each at its place. -->
<link rel="stylesheet" href="../tiles.css">
<style>
html,body{margin:0;overflow:hidden;background:#fff;font-family:var(--sf)}
#a{position:relative;overflow:hidden;background:#fff}#a>*{position:absolute}
.face{width:1208px;height:824px;background:#fff;box-sizing:border-box;padding:96px 0 0 104px}
.face img{display:block;height:170px;max-width:210px;object-fit:contain;object-position:left center}
.face b{display:block;font:650 124px/1 var(--sf);letter-spacing:-2.5px;margin-top:92px;color:#000;white-space:nowrap}
.face i{display:block;font:400 82px/1 var(--sf);font-style:normal;letter-spacing:-1px;margin-top:44px;color:#8A8A8E;white-space:nowrap}
.face i u{text-decoration:none;color:#00A878;font-weight:600}
.glyph{width:400px;height:400px;background:#fff;font:500 250px/400px var(--sf);text-align:center;color:#111}
</style>
<div id="a"></div>
<script>
const spec = JSON.parse(new URLSearchParams(location.search).get("spec")), a = document.getElementById("a");
a.style.width = spec.W + "px"; a.style.height = spec.H + "px";
const add = (cls, x, y, html, css = "") => { const d = document.createElement("div"); d.className = cls; d.style.cssText = `left:${x}px;top:${y}px;${css}`; d.innerHTML = html; a.appendChild(d); };
for (const s of spec.screens) add("", s.x, s.y, "", `width:${s.w}px;height:${s.h}px;background:url(${s.src}) 0 0/${s.w}px ${s.h}px`);
for (const f of spec.faces) add("face", f.x, f.y, `<img src="../assets/sym/c/${f.icon}.png"><b>${f.title}</b><i>${f.preview}</i>`);
for (const g of spec.glyphs) add("glyph", g.x, g.y, g.text);
</script>
<script src="../ready.js"></script>

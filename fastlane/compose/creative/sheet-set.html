<!doctype html><meta charset="utf-8">
<!-- A contact sheet of one direction's complete set: ?spec={direction,title,n}. iPhone frames over iPad frames. -->
<style>
html,body{margin:0;background:#fff}
body{width:3400px;padding:80px 80px 30px;box-sizing:border-box;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#111}
h2{margin:0 0 30px;font:700 54px/1.1 inherit;letter-spacing:-.8px}h2 span{font-weight:400;color:#6b6b70}
.row{display:flex;gap:20px;margin-bottom:90px}
.row img{border-radius:36px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.ph img{width:387px;height:841px;border-radius:36px}.pd img{width:387px;height:516px;border-radius:22px}
.n{font:600 26px/1 inherit;color:#8a8a8e;text-align:center;margin-top:12px}
</style>
<body>
<script>
const spec = JSON.parse(new URLSearchParams(location.search).get("spec")), pad = (i) => String(i).padStart(2, "0");
const row = (dev, cls, label) => `<h2>${spec.title} <span>— ${label}</span></h2><div class="row ${cls}">` +
  Array.from({ length: spec.n }, (_, i) => `<div><img src="sets/${spec.direction}/${dev}/${pad(i + 1)}.png"><div class="n">${i + 1}</div></div>`).join("") + `</div>`;
document.body.innerHTML = row("iphone", "ph", "iPhone, 1320 × 2868") + row("ipad", "pd", "iPad, 2064 × 2752");
</script>
<script src="ready.js"></script>
